[project]
name = "ha-scpi-psu"
version = "1.1.7"
description = "Home Assistant custom integration for SCPI Programmable Bench Power Supplies"
readme = "README.md"
requires-python = ">=3.14.2"
dependencies = [
    "serialx>=1.11.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-homeassistant-custom-component>=0.13.375",
    "pyserial>=3.5",
    "aiousbwatcher>=1.1.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
norecursedirs = [".venv"]
pythonpath = ["."]
