name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semantic version tag to release (e.g. v1.2.0)"
        required: true
        type: string
      title:
        description: "Release title"
        required: false
        type: string
      notes:
        description: "Release notes / changelog description"
        required: false
        type: string

permissions:
  contents: write

jobs:
  validate:
    name: Validate Prior to Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hassfest
        uses: home-assistant/actions/hassfest@master
      - name: HACS
        uses: hacs/action@main
        with:
          category: integration
          ignore: brands

  release:
    name: Publish Stable Release
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update Manifest Version and Commit
        run: |
          CLEAN_VER="${{ inputs.version }}"
          CLEAN_VER="${CLEAN_VER#v}"
          echo "Updating manifest.json version to $CLEAN_VER"
          python3 -c "import json; p='custom_components/scpi_psu/manifest.json'; d=json.load(open(p)); d['version']='$CLEAN_VER'; json.dump(d, open(p,'w'), indent=2); open(p,'a').write('\n')"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add custom_components/scpi_psu/manifest.json
          git commit -m "chore(release): bump manifest version to $CLEAN_VER" || echo "No changes to commit"
          git push origin main

      - name: Create Git Tag and GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ inputs.version }}
          REL_TITLE: ${{ inputs.title }}
          REL_NOTES: ${{ inputs.notes }}
        run: |
          TITLE="${REL_TITLE:-$TAG_NAME}"
          NOTES="${REL_NOTES:-Release $TAG_NAME}"
          git tag -f "$TAG_NAME"
          git push origin -f "$TAG_NAME"
          gh release create "$TAG_NAME" \
            --title "$TITLE" \
            --notes "$NOTES"
